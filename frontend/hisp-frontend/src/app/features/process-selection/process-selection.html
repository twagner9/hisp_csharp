<label>Image operation: </label>
<select (change)="updateSelectedOp($event)">
  @for (option of options; track option.value) {
    <option [value]="option.value">{{ option.label }}</option>
  }
</select>
@if (needRadius()) {
  <label>Kernel radius: </label>
  <input
    type="number"
    max="13"
    min="1"
    step="2"
    [value]="svc.kernelVal()"
    (change)="updateKernel($event)"
  />
}
@if (needSigma()) {
  <label>Sigma value: </label>
  <input
    type="number"
    max="7.0"
    min="0.01"
    step="0.01"
    [value]="svc.sigmaVal()"
    (change)="updateSigma($event)"
  />
}
