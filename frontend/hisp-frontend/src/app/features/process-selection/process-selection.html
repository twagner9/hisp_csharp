<div class="inputComponents">
  <div class="imageOpData">
    <label>Image operation: </label>
    <select (change)="updateSelectedOp($event)">
      @for (option of options; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>
  <div class="additionalData" [class.hidden]="!needRadius()">
    <label>Kernel radius: </label>
    <input
      type="number"
      max="13"
      min="1"
      step="2"
      [value]="svc.kernelVal()"
      (change)="updateKernel($event)"
    />
  </div>
  <div class="additionalData" [class.hidden]="!needSigma()">
    <label>Sigma value: </label>
    <input
      type="number"
      max="7.0"
      min="0.01"
      step="0.01"
      [value]="svc.sigmaVal()"
      (change)="updateSigma($event)"
    />
  </div>
  <div class="additionalData" [class.hidden]="!needDelta()">
    <label>Delta value: </label>
    <input
      type="number"
      max="255"
      min="-255"
      step="1"
      [value]="svc.deltaVal()"
      (change)="updateDelta($event)"
    />
  </div>
  <div class="additionalData" [class.hidden]="!needThreshold()">
    <label>Threshold value: </label>
    <input
      type="number"
      max="255"
      min="-255"
      step="1"
      [value]="svc.thresholdVal()"
      (change)="updateThreshold($event)"
    />
  </div>
</div>
