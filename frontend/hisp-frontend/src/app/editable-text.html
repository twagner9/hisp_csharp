<span>
    @if (editing()) {
        <input 
			#editableTextInput
			class="autoWidth"
			[value]="savedText()" 
			(input)="savedText.set(($any($event.target)).value)" 
			(blur)="saveUserInput()" 
			(keydown.enter)="saveUserInput()"
			/>
    } @else {<span class="autoWidth" (click)="editing.set(true)">
				{{savedText()}}
			</span>}
</span>
